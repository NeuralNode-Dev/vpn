name: Weekly Health Audit & Keep-Alive

on:
  schedule:
    - cron: "15 3 * * 1" # 每周一清晨自动运行
  workflow_dispatch:      # 支持在 Actions 页面随时手动点按钮触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Data & Refresh Timestamp
        run: |
          python -c "
          import datetime, re
          today = datetime.datetime.now(datetime.timezone.utc).strftime('%Y--%m--%d')
          try:
              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              # 自动将徽章里的日期刷新为当周最新日期，保鲜活跃度
              new_content = re.sub(r'Update-[\d\-]+', f'Update-{today}', content)
              if new_content != content:
                  with open('README.md', 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print('Timestamp refreshed successfully.')
              else:
                  print('No timestamp change needed.')
          except Exception as e:
              print(f'Keep-alive pass: {e}')
          "

      - name: Auto-Commit Keep-Alive
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "chore(auto): weekly health verification & keep-alive [skip ci]"
          git push
